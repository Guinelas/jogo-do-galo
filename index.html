<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jogo do Galo - joga a dois ou contra o computador. Funciona offline como PWA.">
    <meta name="author" content="Guilherme Nelas">
    <meta name="keywords" content="Jogo do Galo, Jogo da Velha, PWA, JavaScript, Bootstrap">
    <meta name="theme-color" content="#452564">
    <title>Jogo do Galo</title>
    <link rel="manifest" href="pwa/manifest.json">
    <link rel="icon" href="img/icon.webp" type="image/svg+xml">
    <link rel="apple-touch-icon" href="img/icon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Rubik+Storm&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="card game-card shadow-lg">
                    <div class="card-body p-4">

                        <h1 class="text-center mb-4">
                            <img class="logo" src="img/icon.webp" alt="Logótipo do Jogo do Galo">
                            Jogo do Galo
                        </h1>
                        <div class="btn-group w-100 mb-3" role="group" aria-label="Modo de jogo">
                            <input type="radio" class="btn-check" name="modo" id="modo-2j" autocomplete="off" checked>
                            <label class="btn btn-outline-primary" for="modo-2j">2 Jogadores</label>

                            <input type="radio" class="btn-check" name="modo" id="modo-pc" autocomplete="off">
                            <label class="btn btn-outline-primary" for="modo-pc">Contra o Computador</label>
                        </div>
                        <div class="row text-center g-2 mb-3" aria-label="Pontuação">
                            <div class="col-4">
                                <div class="score-box">
                                    <small>Jogador X</small>
                                    <strong id="scoreX">0</strong>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="score-box">
                                    <small>Empates</small>
                                    <strong id="scoreDraws">0</strong>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="score-box">
                                    <small id="labelO">Jogador O</small>
                                    <strong id="scoreO">0</strong>
                                </div>
                            </div>
                        </div>
                        <p class="status text-center" aria-live="polite">
                            Vez de: <span id="currentPlayer">X</span>
                        </p>
                        <div id="board" role="group" aria-label="Tabuleiro do jogo">
                            <button type="button" class="cell" data-index="0" aria-label="Casa 1"></button>
                            <button type="button" class="cell" data-index="1" aria-label="Casa 2"></button>
                            <button type="button" class="cell" data-index="2" aria-label="Casa 3"></button>
                            <button type="button" class="cell" data-index="3" aria-label="Casa 4"></button>
                            <button type="button" class="cell" data-index="4" aria-label="Casa 5"></button>
                            <button type="button" class="cell" data-index="5" aria-label="Casa 6"></button>
                            <button type="button" class="cell" data-index="6" aria-label="Casa 7"></button>
                            <button type="button" class="cell" data-index="7" aria-label="Casa 8"></button>
                            <button type="button" class="cell" data-index="8" aria-label="Casa 9"></button>
                        </div>
                        <div class="d-flex gap-2 justify-content-center mt-4">
                            <button type="button" id="btnNovoJogo" class="btn btn-primary">Novo Jogo</button>
                            <button type="button" id="btnReporPontos" class="btn btn-outline-secondary">Repor Pontuação</button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>
    <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-header justify-content-center">
                    <h2 class="modal-title h4" id="resultModalTitle">Fim de Jogo</h2>
                </div>
                <div class="modal-body">
                    <p id="resultMessage" class="fs-3 mb-0"></p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Jogar outra vez</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/game.js"></script>
</body>
</html>
